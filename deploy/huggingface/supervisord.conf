; Starts and supervises every BotForge process inside the single container.
; All output goes to the container log (the "Logs" tab on Hugging Face).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/data/supervisord.pid

[unix_http_server]
file=/data/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/supervisor.sock

[program:rabbitmq]
command=/usr/lib/rabbitmq/bin/rabbitmq-server
priority=10
startsecs=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:identity]
command=dotnet Identity.Api.dll
directory=/app/identity
environment=ASPNETCORE_URLS="http://127.0.0.1:5120"
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bots]
command=dotnet Bots.Api.dll
directory=/app/bots
environment=ASPNETCORE_URLS="http://127.0.0.1:5215"
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ingestion]
command=/opt/venv/bin/python -m app.worker
directory=/app/ingestion
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chat]
command=/opt/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/chat
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=node server.js
directory=/app/dashboard
environment=PORT="3000",HOSTNAME="127.0.0.1"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=dotnet Gateway.Api.dll
directory=/app/gateway
environment=ASPNETCORE_URLS="http://0.0.0.0:%(ENV_PUBLIC_PORT)s"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
